# Publica o site estático dos mapas (site/) no GitHub Pages a cada push na
# main. O conteúdo já vem pronto do repositório: quem gera é o `make site`, na
# máquina de quem escreve — o workflow só publica o que foi commitado. Assim a
# publicação não depende dos microdados (que não estão no git) nem da API do
# IBGE estar no ar.
#
# Antes do primeiro uso: Settings > Pages > Source = GitHub Actions.
name: Publicar mapas no Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; um push novo cancela a anterior em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
