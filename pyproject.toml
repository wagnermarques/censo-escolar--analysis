[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "censo-escolar"
version = "0.1.0"
description = "Análise dos microdados do Censo Escolar da Educação Básica (INEP)"
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "requests>=2.31",
    # Lê a planilha "ANEXO I - Dicionário de Dados" que vem no ZIP do INEP; é
    # de lá que saem as descrições oficiais das variáveis (censo_escolar.esquema).
    "openpyxl>=3.1",
]

[project.scripts]
censo = "censo_escolar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
