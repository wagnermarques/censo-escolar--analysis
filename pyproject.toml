[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "censo-escolar"
version = "0.1.0"
description = "Análise dos microdados do Censo Escolar da Educação Básica (INEP)"
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.scripts]
censo = "censo_escolar.cli:main"
orgnb = "censo_escolar.orgnb:main"

[tool.setuptools.packages.find]
where = ["src"]

# Grupos de dependências (PEP 735), não `optional-dependencies`: o uv instala
# grupos por padrão (veja default-groups abaixo), enquanto extras exigiriam
# `--extra` em toda chamada. Não há "instalação enxuta" separada aqui — o
# `uv sync` de sempre já cobria notebook+dev de uma vez só.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.29"]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
